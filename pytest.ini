[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_
markers =
    slow: медленные тесты (latency, reindex)
    smoke: базовые smoke-тесты
    search: тесты качества поиска
    config: тесты конфигурации
    regression: регрессионные тесты (полный прогон)
    chroma: тесты, требующие ChromaDB
